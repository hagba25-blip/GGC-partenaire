name: ggc_partenaire
description: GGC PARTENAIRE - Application de gestion de crédit téléphone
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  device_info_plus: ^11.1.0
  geolocator: ^13.0.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  animate_do: ^3.3.4
  connectivity_plus: ^6.0.5
  workmanager: ^0.10.0
  network_info_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icone_logo_ggc.png"
  min_sdk_android: 21