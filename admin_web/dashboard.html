<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GGC PARTENAIRE — Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logom.jpeg">
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <img src="logom.jpeg" alt="GGC PARTENAIRE" style="width:80%; display:block; margin:0 auto 20px;">
      <nav>
        <a href="dashboard.html" class="active">📊 Tableau de bord</a>
        <a href="clients.html">👥 Clients</a>
        <a href="carte.html">🗺️ Carte des appareils</a>
        <a href="#" onclick="logout()">🚪 Déconnexion</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h2>Tableau de bord</h2>
        <span class="admin-badge" id="adminBadge"></span>
      </div>

      <div class="stats-grid fade-in-up">
        <div class="stat-card">
          <div class="value" id="statTotal">—</div>
          <div class="label">Clients inscrits</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statActifs">—</div>
          <div class="label">Comptes actifs</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statRetard">—</div>
          <div class="label">En retard de paiement</div>
        </div>
        <div class="stat-card">
          <div class="value" id="statBloques">—</div>
          <div class="label">Appareils restreints</div>
        </div>
      </div>

      <div class="table-card fade-in">
        <table>
          <thead>
            <tr>
              <th>Client</th>
              <th>Téléphone</th>
              <th>Montant total</th>
              <th>Mode</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="clientsTableBody">
            <tr><td colspan="5" style="text-align:center;padding:30px;color:#6B8299;">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
