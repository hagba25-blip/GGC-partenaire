<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GGC PARTENAIRE — Clients</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logom.jpeg">
<style>
  .search-bar { margin-bottom: 20px; }
  .search-bar input {
    width: 100%; max-width: 400px; padding: 12px 16px;
    border: 1.5px solid #E0EEF5; border-radius: 12px; font-size: 14px;
  }
</style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <img src="logom.jpeg" alt="GGC PARTENAIRE" style="width:80%; display:block; margin:0 auto 20px;">
      <nav>
        <a href="dashboard.html">📊 Tableau de bord</a>
        <a href="clients.html" class="active">👥 Clients</a>
        <a href="carte.html">🗺️ Carte des appareils</a>
        <a href="#" onclick="logout()">🚪 Déconnexion</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h2>Tous les clients</h2>
        <span class="admin-badge" id="adminBadge"></span>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Rechercher par nom, téléphone, email, IMEI…">
      </div>

      <div class="table-card fade-in">
        <table>
          <thead>
            <tr>
              <th>Client</th>
              <th>Email</th>
              <th>Téléphone</th>
              <th>IMEI</th>
              <th>Statut</th>
              <th>Dernière position</th>
            </tr>
          </thead>
          <tbody id="clientsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="clients.js"></script>
</body>
</html>
